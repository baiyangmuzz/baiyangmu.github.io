<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>baiyangmu</title>
<meta name="description" content="baiyangmu 的个人主页">
<meta name="theme-color" content="#05060a">
<meta property="og:title" content="baiyangmu">
<meta property="og:description" content="baiyangmu 的个人主页">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="progress"><i id="progressBar"></i></div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="grid-bg" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>

<div class="cursor" id="cursor" aria-hidden="true"></div>
<div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

<main>

  <header class="hero" id="top">
    <div class="avatar-wrap" data-rv>
      <div class="ring" aria-hidden="true"></div>
      <img class="avatar" src="https://avatars.githubusercontent.com/u/174950627?v=4"
           alt="baiyangmu 的头像" width="128" height="128">
    </div>

    <h1 class="title glitch" data-text="baiyangmu" data-rv>baiyangmu</h1>
    <p class="handle" data-rv>@baiyangmuzz</p>
    <p class="typed-line"><span id="typed"></span><i class="caret"></i></p>
  </header>

  <div class="ticker" data-rv aria-hidden="true">
    <div class="ticker-track">
      <span>✦ DESIGN</span><span>✦ CODE</span><span>✦ BUILD</span><span>✦ SHIP</span><span>✦ REPEAT</span>
      <span>✦ DESIGN</span><span>✦ CODE</span><span>✦ BUILD</span><span>✦ SHIP</span><span>✦ REPEAT</span>
    </div>
  </div>

  <section class="sec" id="links">
    <h2 class="sec-title" data-rv><span>01</span> 链接</h2>
    <div class="grid">
      <!-- ↓↓↓ 加/删卡片：复制一个 <a class="card tilt"> 即可 ↓↓↓ -->
      <a class="card tilt" href="https://github.com/baiyangmuzz" target="_blank" rel="noopener" data-rv>
        <span class="card-ico">⌨</span>
        <span class="card-body">
          <strong>GitHub</strong>
          <small>github.com/baiyangmuzz</small>
        </span>
        <span class="card-arrow">→</span>
      </a>
      <a class="card tilt" href="#" data-rv>
        <span class="card-ico">✉</span>
        <span class="card-body">
          <strong>Email</strong>
          <small>你的邮箱地址</small>
        </span>
        <span class="card-arrow">→</span>
      </a>
      <!-- ↑↑↑ ↑↑↑ ↑↑↑ -->
    </div>
  </section>

  <section class="sec" id="about">
    <h2 class="sec-title" data-rv><span>02</span> 关于</h2>
    <div class="panel" data-rv>
      <ul class="facts">
        <!-- ↓↓↓ 改这里 ↓↓↓ -->
        <li><b>在做</b><span>在做什么</span></li>
        <li><b>研究</b><span>在研究什么</span></li>
        <li><b>坐标</b><span>所在城市</span></li>
        <li><b>联系</b><span>怎么找到我</span></li>
        <!-- ↑↑↑ ↑↑↑ -->
      </ul>
    </div>
  </section>

  <section class="sec" id="stats">
    <h2 class="sec-title" data-rv><span>03</span> 此刻</h2>
    <div class="grid grid-3">
      <div class="stat" data-rv><b id="clock">--:--:--</b><small>本地时间</small></div>
      <div class="stat" data-rv><b id="uptime">--</b><small>已上线</small></div>
      <div class="stat" data-rv><b>100%</b><small>折腾热情</small></div>
    </div>
  </section>

</main>

<footer class="foot">
  <span>© <span id="year"></span> baiyangmu</span>
  <span class="dot"></span>
  <span>Powered by GitHub Pages</span>
</footer>

<a class="totop" href="#top" aria-label="回到顶部">↑</a>

<script src="app.js"></script>
</body>
</html>
